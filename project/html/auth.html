  <section class="hero-section backindex ">
   <div class="auth-box">

      <form class="contactbox login" id="loginform">
          <h2>تسجيـل الدخـول</h2><br>
          <label for="signemail">البريد الإلكتروني</label><br>
          <input type="email"  placeholder="example@gmail.com" required id="signemail"><br><br>
          <label for="signpassword">كلمـة المـرور</label><br>
          <input type="password" placeholder="********" required id="signpassword">

          <button class="subbtn" type="submit" class="submit-btn">دخـول</button>
          <p style="color: black;"> ليس لديك حساب ؟ <a class="switch"  onclick="switchform()"> إنشـاء حسـاب جديـد</a></p>
          
      </form>


      <form class="contactbox createaccount hidden" id="registerform" >
          <h2>إنشـاء حسـاب جديـد</h2><br>
          <label for="loginname" >الاسم</label><br>
          <input type="text" id="loginname" placeholder="ادخل اسمـك" required minlength="3"><br><br>
          <label for="loginemail">البريد الإلكتروني</label><br>
          <input type="email" id="loginemail" placeholder="example@gmail.com" required><br><br>
          <label for="loginpassword">كلمـة المـرور</label><br>
          <input type="password" id="loginpassword" placeholder="********" required minlength="8">
          <button class="subbtn" type="submit" class="submit-btn" >إنشـاء</button>
          <p style="color: black;">  لديك حساب بالفعل ؟ <a class="switch"  onclick="switchform()"> تسجيـل الدخـول</a></p>
      </form>
   </div>

  </section>

    <div id="successmodal" class="modal">
     <div class="modal-box">
      <div class="modal-header">

        <span onclick="closesuccess()" class="close-x" >&times;</span>
